# By default this config loads hd-driver-openai from the remote driver
# registry. To use a pre-fetched local binary instead, load this repo with:
#
# repos:
#   - repo: <this repo>
#     options:
#       use_local_binary: true
#
# Optional repo options for the remote case:
#   registry: override the named registry (default: charles-gh-pages)
#   channel: override the release channel (default: stable)
#   version: pin an exact release version
drivers:
  daemon:
    drivers:
      openai:
        name: openai
        type: '{% if .options.use_local_binary %}builtin{% else %}remote{% end %}'
        handlerData:
{% if .options.use_local_binary %}
          shortName: hd-driver-openai
{% else %}
          registry: '{% default "charles-gh-pages" .options.registry %}'
          channel: '{% default "stable" .options.channel %}'
{% if .options.version %}
          version: '{% .options.version %}'
{% end %}
{% end %}
        description: |
          This driver enables Honeydipper to interact with OpenAI's language models,
          allowing you to generate text, answer questions, and perform various natural
          language processing tasks.
        meta:
          labels:
            - agent_driver

  openai:
    engines:
      default:
        api_key: '{% .env.OPENAI_API_KEY %}'
        model: gpt-5.4-mini
        # Custom HTTP headers to include with every API request to the provider.
        # Useful for specifying provider-specific auth tokens, tracing headers,
        # or routing information for OpenAI-compatible endpoints.
        # headers:
        #   X-Title: My Application
        #   HTTP-Referer: https://myapp.example.com
        # Retry configuration for transient upstream API errors (e.g. 429 rate limit).
        # When the driver detects a retryable error (rate_limit_exceeded,
        # insufficient_quota, or server_error) in the API response body, it will
        # retry the request with exponential backoff and jitter.
        #
        # Set retry_max_attempts to 0 to disable retries entirely.
        # retry_max_attempts: 3
        # retry_initial_delay: "1s"
        # retry_max_delay: "30s"
